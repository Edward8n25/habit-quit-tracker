<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 断环 + 起点（2026-11-12 定稿，方案 C）：
       缺口环 = 中断的循环；缺口起点的绿点 = 从此刻重新开始。
       纯几何，无文字元素 / 无渐变 —— favicon 缩到 16px 仍可辨认，且跨平台字形无关。 -->
  <rect width="512" height="512" rx="112" fill="#121212"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="52"
          stroke-linecap="round" stroke-dasharray="706.9 235.6" transform="rotate(-90 256 256)"/>
  <circle cx="256" cy="106" r="40" fill="#1db954"/>
</svg>
