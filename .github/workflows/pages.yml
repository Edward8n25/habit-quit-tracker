name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # N-30：6 个测试脚本 + 语法检查必须先跑，失败则不部署。
  # 原先 workflow 只做 checkout → upload → deploy，断言全靠手动，任何回归都能直接上线。
  # PR 上也跑测试（作为合并门禁），但不部署。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 语法检查
        run: node --check src/app.js
      - name: 冒烟测试
        run: node tests/smoke-test.js
      - name: 弹窗交互测试
        run: node tests/picker-interaction.js
      - name: 样式守门
        run: node tests/style-consistency.js
      - name: 配色对比度
        run: node tests/contrast-check.js
      - name: SW 断言
        run: node tests/assert-sw.js
      - name: 静态资源校验
        run: node scripts/check-assets.js

  deploy:
    needs: test
    # PR 只跑测试不部署：github-pages 环境在 PR 上无部署权限，否则 workflow 会红
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 保持全量部署（含 tests/）：tests/fixture-picker.html 用 '../index.html' 加载真实页面，
      # 是 v3 规范 §7.4 上线核验清单的线上回归入口，收窄发布范围会破坏这条既有流程。
      # .dev/ 已被 .gitignore 排除，不进仓库也就不可能被部署。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
